[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["staticfiles", ".venv", ".deploy-venv", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
addopts = "-ra"
