{% extends "base.html" %}
{% block content %}
  <h1>Hello, world</h1>
  <p>This is the django-template starter app.</p>
  {% if user.is_authenticated %}
    <p>Logged in as <strong>{{ user.username }}</strong>. <a href="{% url 'chat:index' %}">Try the chat</a>. <a href="{% url 'logout' %}">Log out</a>.</p>
  {% else %}
    <p><a href="/login/globus/">Log in with Globus</a> to access the chat.</p>
  {% endif %}
{% endblock %}
